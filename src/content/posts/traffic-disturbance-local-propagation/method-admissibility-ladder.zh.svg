<svg xmlns="http://www.w3.org/2000/svg" width="720" height="1320" viewBox="0 0 720 1320" role="img" aria-labelledby="title desc">
  <title id="title">从全局频率响应到 Kakeya 型入射问题的方法资格阶梯</title>
  <desc id="desc">四层方法从传递函数和半群、局域时频表示、算子适配波包，逐步走向解耦与 Kakeya 型入射几何。每一层都标出问题、对象和升级条件。</desc>
  <defs>
    <marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0L9 4.5L0 9Z" fill="#69747e"/></marker>
    <filter id="shadow" x="-15%" y="-15%" width="130%" height="140%"><feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#17212b" flood-opacity=".08"/></filter>
  </defs>
  <style>
    text { font-family: "Noto Sans CJK SC", "PingFang SC", "Microsoft YaHei", sans-serif; fill: #17212b; }
    .title { font-size: 32px; font-weight: 760; }
    .subtitle { font-size: 17px; fill: #65707a; }
    .level { font-size: 27px; font-weight: 800; }
    .card-title { font-size: 24px; font-weight: 740; }
    .label { font-size: 16px; font-weight: 760; letter-spacing: .7px; }
    .body { font-size: 18px; fill: #303b45; }
    .small { font-size: 16px; fill: #65707a; }
    .gate { font-size: 16px; font-weight: 650; fill: #53606b; }
  </style>
  <rect width="720" height="1320" rx="28" fill="#f7f5f0"/>
  <text class="title" x="40" y="58">方法资格阶梯</text>
  <text class="subtitle" x="40" y="88">问题多要求一类结构，方法才向上走一层</text>

  <g id="h0" filter="url(#shadow)">
    <rect x="36" y="120" width="648" height="218" rx="24" fill="#eef3fb" stroke="#b6c8e5" stroke-width="2"/>
    <circle cx="92" cy="174" r="34" fill="#3567c8"/>
    <text class="level" x="92" y="184" text-anchor="middle" fill="#ffffff">H0</text>
    <text class="card-title" x="146" y="166">全局响应</text>
    <text class="label" x="146" y="198" fill="#285dbb">对象</text>
    <text class="body" x="205" y="198">传递函数 · 半群 · 预解式</text>
    <text class="label" x="64" y="250" fill="#285dbb">查询</text>
    <text class="body" x="123" y="250">给定端口间的增益、相位、衰减或串稳定性</text>
    <text class="small" x="64" y="297">开篇的线性汇流算例在这一层已经解决</text>
  </g>

  <g id="gate01">
    <path d="M360 342V382" stroke="#69747e" stroke-width="3" marker-end="url(#arrow)"/>
    <rect x="196" y="350" width="328" height="42" rx="21" fill="#ffffff" stroke="#d7d3cd"/>
    <text class="gate" x="360" y="378" text-anchor="middle">升级：问题要求位置与短时结构</text>
  </g>

  <g id="h1" filter="url(#shadow)">
    <rect x="36" y="402" width="648" height="218" rx="24" fill="#eaf6f4" stroke="#acd7d1" stroke-width="2"/>
    <circle cx="92" cy="456" r="34" fill="#16877d"/>
    <text class="level" x="92" y="466" text-anchor="middle" fill="#ffffff">H1</text>
    <text class="card-title" x="146" y="448">局域时频</text>
    <text class="label" x="146" y="480" fill="#0d6f67">对象</text>
    <text class="body" x="205" y="480">滑动窗 · 小波 · Green 函数 · 路径分解</text>
    <text class="label" x="64" y="532" fill="#0d6f67">查询</text>
    <text class="body" x="123" y="532">扰动在哪里、什么时候、以什么尺度出现</text>
    <text class="small" x="64" y="579">位置可见，但传播方向仍需由动力学给出</text>
  </g>

  <g id="gate12">
    <path d="M360 624V664" stroke="#69747e" stroke-width="3" marker-end="url(#arrow)"/>
    <rect x="174" y="632" width="372" height="42" rx="21" fill="#ffffff" stroke="#d7d3cd"/>
    <text class="gate" x="360" y="660" text-anchor="middle">升级：算子能解释局域模式的运动方向</text>
  </g>

  <g id="h2" filter="url(#shadow)">
    <rect x="36" y="684" width="648" height="218" rx="24" fill="#fff5e5" stroke="#e6c08a" stroke-width="2"/>
    <circle cx="92" cy="738" r="34" fill="#c27919"/>
    <text class="level" x="92" y="748" text-anchor="middle" fill="#ffffff">H2</text>
    <text class="card-title" x="146" y="730">算子适配波包</text>
    <text class="label" x="146" y="762" fill="#a85f0b">对象</text>
    <text class="body" x="205" y="762">符号 · 色散关系 · 相空间 · 波包</text>
    <text class="label" x="64" y="814" fill="#a85f0b">查询</text>
    <text class="body" x="123" y="814">包沿什么通道传播，管外误差有多大</text>
    <text class="small" x="64" y="861">LWR 的平坦色散说明：能追踪包不等于具备曲率几何</text>
  </g>

  <g id="gate23">
    <path d="M360 906V946" stroke="#69747e" stroke-width="3" marker-end="url(#arrow)"/>
    <rect x="125" y="914" width="470" height="42" rx="21" fill="#ffffff" stroke="#d7d3cd"/>
    <text class="gate" x="360" y="942" text-anchor="middle">升级：方向分离、横截性与多尺度非聚集已证</text>
  </g>

  <g id="h3" filter="url(#shadow)">
    <rect x="36" y="966" width="648" height="218" rx="24" fill="#f1ebf8" stroke="#c5b2dd" stroke-width="2"/>
    <circle cx="92" cy="1020" r="34" fill="#7653a6"/>
    <text class="level" x="92" y="1030" text-anchor="middle" fill="#ffffff">H3</text>
    <text class="card-title" x="146" y="1012">多尺度入射几何</text>
    <text class="label" x="146" y="1044" fill="#684596">对象</text>
    <text class="body" x="205" y="1044">解耦 · Furstenberg · Kakeya</text>
    <text class="label" x="64" y="1096" fill="#684596">查询</text>
    <text class="body" x="123" y="1096">多方向的包族能否被压进很小的时空并集</text>
    <text class="small" x="64" y="1143">交通问题尚需自己定义管、方向、尺度与被约束的量</text>
  </g>

  <rect x="70" y="1222" width="580" height="58" rx="20" fill="#ffffff" stroke="#d8d5cf"/>
  <text class="body" x="360" y="1258" text-anchor="middle">层级表示证明义务，不是“先进程度”排名</text>
</svg>
