<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1600" viewBox="0 0 1200 1600" role="img" aria-labelledby="title desc">
  <title id="title">直接说话以后，还缺什么</title>
  <desc id="desc">冬马和纱与小木曾雪菜在电话中能即时打断、求助和拒绝，通话也改变雪菜次日行动；北原春希不在通话中，三人仍未取得同一份事实、各自回答和可重谈的生活安排。</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0 0 10 5 0 10Z" fill="#89999d"/>
    </marker>
    <marker id="gold-arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0 0 10 5 0 10Z" fill="#a5844f"/>
    </marker>
    <style>
      .t{font-family:"Noto Sans CJK SC","Source Han Sans SC",sans-serif;fill:#172832}
      .title{font-size:50px;font-weight:700;letter-spacing:2px}
      .sub{font-size:26px;fill:#59686e}
      .name{font-size:31px;font-weight:700}
      .body{font-size:26px;fill:#405158}
      .small{font-size:23px;fill:#59686e}
      .head{font-size:29px;font-weight:700}
      .result{font-size:39px;font-weight:700;fill:#f4f0e8}
      .result-sub{font-size:25px;fill:#d7e0e1}
      .foot{font-size:23px;fill:#69767b}
      .inverse{fill:#f4f0e8}
      .line{stroke:#89999d;stroke-width:4;fill:none;marker-end:url(#arrow)}
      .bi{stroke:#a5844f;stroke-width:5;fill:none;marker-end:url(#gold-arrow)}
      .dash{stroke:#aab5b7;stroke-width:4;fill:none;stroke-dasharray:11 9}
    </style>
  </defs>
  <rect width="1200" height="1600" fill="#f4f0e8"/>
  <rect width="1200" height="18" fill="#183440"/>
  <text x="600" y="78" text-anchor="middle" class="t title">直接说话以后，还缺什么</text>
  <text x="600" y="122" text-anchor="middle" class="t sub">《不倶戴天》的电话让两个人互相回答，却没有自动变成三个人的安排</text>

  <g aria-label="电话中的两个回答者">
    <circle cx="255" cy="345" r="118" fill="#e5eae8" stroke="#607b80" stroke-width="4"/>
    <text x="255" y="337" text-anchor="middle" class="t name">冬马和纱</text>
    <text x="255" y="382" text-anchor="middle" class="t body">先拨通</text>

    <circle cx="945" cy="345" r="118" fill="#eee4d2" stroke="#a5844f" stroke-width="4"/>
    <text x="945" y="337" text-anchor="middle" class="t name">小木曾雪菜</text>
    <text x="945" y="382" text-anchor="middle" class="t body">接起电话</text>

    <path d="M382 306H808" class="bi"/>
    <path d="M818 384H392" class="bi"/>
    <text x="600" y="277" text-anchor="middle" class="t body">叫住 ／ 打断 ／ 求助</text>
    <text x="600" y="431" text-anchor="middle" class="t body">指责 ／ 拒绝 ／ 改口</text>
    <rect x="430" y="466" width="340" height="62" rx="16" fill="#183440"/>
    <text x="600" y="507" text-anchor="middle" class="t body inverse">约四至五小时，同步双向</text>
  </g>

  <g aria-label="未进入通话的春希">
    <circle cx="600" cy="690" r="95" fill="#fbfaf6" stroke="#aab5b7" stroke-width="4" stroke-dasharray="12 9"/>
    <text x="600" y="683" text-anchor="middle" class="t name">北原春希</text>
    <text x="600" y="725" text-anchor="middle" class="t small">不在通话中</text>
    <path d="M319 455C390 555 447 617 505 661" class="dash"/>
    <path d="M881 455C810 555 753 617 695 661" class="dash"/>
    <text x="600" y="835" text-anchor="middle" class="t body">谈话围绕他展开，内容却没有交给他共同回答</text>
  </g>

  <path d="M600 862V916" class="line"/>

  <g aria-label="通话后的三条行动线">
    <rect x="55" y="930" width="1090" height="72" rx="18" fill="#607b80"/>
    <text x="600" y="977" text-anchor="middle" class="t head inverse">第二天：电话改变行动，却没有单独完成恢复</text>

    <rect x="55" y="1035" width="340" height="230" rx="22" fill="#eee4d2" stroke="#a5844f" stroke-width="2"/>
    <text x="225" y="1088" text-anchor="middle" class="t head">雪菜</text>
    <text x="225" y="1136" text-anchor="middle" class="t body">回到厨房和家人身边</text>
    <text x="225" y="1176" text-anchor="middle" class="t body">决定再去见春希</text>
    <text x="225" y="1222" text-anchor="middle" class="t small">来电直接改变她的下一步</text>

    <rect x="430" y="1035" width="340" height="230" rx="22" fill="#fbfaf6" stroke="#89999d" stroke-width="2"/>
    <text x="600" y="1088" text-anchor="middle" class="t head">春希</text>
    <text x="600" y="1136" text-anchor="middle" class="t body">药物 ／ 诊疗 ／ 帮助</text>
    <text x="600" y="1176" text-anchor="middle" class="t body">与时间已在起作用</text>
    <text x="600" y="1222" text-anchor="middle" class="t small">后来仍可关闭和纱话题</text>

    <rect x="805" y="1035" width="340" height="230" rx="22" fill="#e5eae8" stroke="#607b80" stroke-width="2"/>
    <text x="975" y="1088" text-anchor="middle" class="t head">和纱</text>
    <text x="975" y="1136" text-anchor="middle" class="t body">面对演出和母亲病情</text>
    <text x="975" y="1176" text-anchor="middle" class="t body">拒绝雪菜的照护提议</text>
    <text x="975" y="1222" text-anchor="middle" class="t small">没有达成三方生活方案</text>
  </g>

  <g aria-label="仍然缺少的共同条件">
    <rect x="55" y="1310" width="1090" height="210" rx="26" fill="#183440"/>
    <text x="600" y="1370" text-anchor="middle" class="t result">能互相回答，不等于能共同决定</text>
    <text x="225" y="1432" text-anchor="middle" class="t result-sub">三个人知道同一件事</text>
    <text x="600" y="1432" text-anchor="middle" class="t result-sub">每个人亲自回答</text>
    <text x="975" y="1432" text-anchor="middle" class="t result-sub">钱、住处、工作与以后</text>
    <line x1="395" y1="1400" x2="395" y2="1460" stroke="#607b80" stroke-width="2"/>
    <line x1="805" y1="1400" x2="805" y2="1460" stroke="#607b80" stroke-width="2"/>
    <text x="600" y="1484" text-anchor="middle" class="t small inverse">这些条件仍须进入下一次谈话和下一天的行动</text>
  </g>

  <text x="600" y="1570" text-anchor="middle" class="t foot">本文原创分析图。实线表示可返回的通话；虚线表示被谈论却未进入通话的位置。</text>
</svg>
