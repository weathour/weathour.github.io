<svg xmlns="http://www.w3.org/2000/svg" width="720" height="1500" viewBox="0 0 720 1500" role="img" aria-labelledby="title desc">
  <title id="title">局部精化只有在允许上下文中保持才能支持系统替换</title>
  <desc id="desc">上部把旧的受控车辆组件 c 放进允许的车队上下文，记录原系统良定并满足性质。中部先给出接受不更窄环境、承诺不更宽保证这一组强充分检查，再要求局部精化由布线保持，并显式检查候选组合良定和目标性质保持。下部显示同端口候选仍可因新增边界行为、收窄环境假设或反馈不良定而失败。</desc>
  <defs>
    <marker id="arrow-dark" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0,0 L10,5 L0,10 Z" fill="#34424f"/>
    </marker>
    <marker id="arrow-teal" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0,0 L10,5 L0,10 Z" fill="#16877d"/>
    </marker>
    <marker id="arrow-blue" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0,0 L10,5 L0,10 Z" fill="#3b6fd8"/>
    </marker>
  </defs>
  <style>
    text { font-family: "Noto Sans CJK SC", "PingFang SC", "Microsoft YaHei", sans-serif; fill: #17212b; }
    .title { font-size: 34px; font-weight: 700; }
    .subtitle { font-size: 19px; fill: #5f6872; }
    .panel-title { font-size: 23px; font-weight: 700; }
    .card-title { font-size: 22px; font-weight: 700; }
    .body { font-size: 20px; fill: #45515d; }
    .small { font-size: 18px; fill: #5f6872; }
    .formula { font-family: "STIX Two Math", "Cambria Math", "Times New Roman", serif; font-size: 22px; }
    .formula-large { font-family: "STIX Two Math", "Cambria Math", "Times New Roman", serif; font-size: 25px; }
  </style>

  <rect width="720" height="1500" rx="28" fill="#f7f5f0"/>
  <text class="title" x="44" y="60">局部更强，什么时候才能真的替换</text>
  <text class="subtitle" x="44" y="94">可替换性是带允许上下文和待保持性质的主张</text>

  <!-- A: baseline context -->
  <g>
    <rect x="30" y="122" width="660" height="330" rx="24" fill="#ffffff" stroke="#d8d5cf" stroke-width="2"/>
    <text class="panel-title" x="52" y="160">A　基线：旧组件 c 位于一个允许的车队上下文</text>

    <rect x="52" y="184" width="616" height="196" rx="22" fill="#e2f4f1" stroke="#16877d" stroke-width="2.5" stroke-dasharray="9 7"/>
    <text class="small" x="72" y="214" fill="#0d6f67">上下文 E[−]：上游车、通信、执行车辆与后续车</text>

    <rect x="76" y="240" width="142" height="76" rx="18" fill="#ffffff" stroke="#16877d" stroke-width="2"/>
    <text class="card-title" x="147" y="273" text-anchor="middle">上游与环境</text>
    <text class="small" x="147" y="300" text-anchor="middle">输入历史</text>

    <rect x="289" y="228" width="142" height="100" rx="20" fill="#f0e9fb" stroke="#7b4ab5" stroke-width="3"/>
    <text class="card-title" x="360" y="267" text-anchor="middle">旧组件 c</text>
    <text class="formula" x="360" y="303" text-anchor="middle">(I, B<tspan baseline-shift="sub" font-size="18">c</tspan>, K<tspan baseline-shift="sub" font-size="18">old</tspan>)</text>

    <rect x="502" y="240" width="142" height="76" rx="18" fill="#ffffff" stroke="#16877d" stroke-width="2"/>
    <text class="card-title" x="573" y="273" text-anchor="middle">后续组件</text>
    <text class="small" x="573" y="300" text-anchor="middle">反馈与传播</text>

    <line x1="218" y1="278" x2="281" y2="278" stroke="#34424f" stroke-width="3" marker-end="url(#arrow-dark)"/>
    <line x1="431" y1="278" x2="494" y2="278" stroke="#34424f" stroke-width="3" marker-end="url(#arrow-dark)"/>
    <path d="M573 316 C573 356,147 356,147 316" fill="none" stroke="#16877d" stroke-width="2.5" stroke-dasharray="8 6" marker-end="url(#arrow-teal)"/>

    <rect x="158" y="394" width="404" height="40" rx="18" fill="#e8efff" stroke="#3b6fd8" stroke-width="2"/>
    <text class="formula-large" x="360" y="422" text-anchor="middle">E[c] ↓　且　E[c] ⊨ ψ　(ψ ∈ Ψ<tspan baseline-shift="sub" font-size="18">req</tspan>)</text>
  </g>

  <!-- B: valid substitution -->
  <g>
    <rect x="30" y="478" width="660" height="466" rx="24" fill="#ffffff" stroke="#d8d5cf" stroke-width="2"/>
    <text class="panel-title" x="52" y="516">B　候选路径：先做强充分检查，再证明组合保持</text>

    <rect x="54" y="546" width="292" height="96" rx="20" fill="#fff0d7" stroke="#c27919" stroke-width="2"/>
    <text class="card-title" x="200" y="579" text-anchor="middle">接受不更窄的环境</text>
    <text class="formula-large" x="200" y="620" text-anchor="middle">A<tspan baseline-shift="sub" font-size="18">old</tspan> ⊆ A<tspan baseline-shift="sub" font-size="18">new</tspan></text>

    <rect x="374" y="546" width="292" height="96" rx="20" fill="#fff0d7" stroke="#c27919" stroke-width="2"/>
    <text class="card-title" x="520" y="579" text-anchor="middle">给出不更宽的保证</text>
    <text class="formula-large" x="520" y="620" text-anchor="middle">G<tspan baseline-shift="sub" font-size="18">new</tspan> ⊆ G<tspan baseline-shift="sub" font-size="18">old</tspan></text>

    <rect x="66" y="670" width="588" height="106" rx="22" fill="#f0e9fb" stroke="#7b4ab5" stroke-width="2.5"/>
    <text class="card-title" x="360" y="704" text-anchor="middle">前同余：局部精化对所允许的布线单调</text>
    <text class="formula-large" x="360" y="748" text-anchor="middle">c′ ≼loc c ⇒ ω(…,c′,…) ≼loc ω(…,c,…)</text>

    <line x1="360" y1="776" x2="360" y2="806" stroke="#3b6fd8" stroke-width="3" marker-end="url(#arrow-blue)"/>

    <rect x="66" y="816" width="588" height="88" rx="22" fill="#e8efff" stroke="#3b6fd8" stroke-width="2.5"/>
    <text class="formula" x="360" y="851" text-anchor="middle">∀ E[−] ∈ C<tspan baseline-shift="sub" font-size="18">adm</tspan> :　E[c] ↓ ⇒ E[c′] ↓</text>
    <text class="formula-large" x="360" y="886" text-anchor="middle">E[c] ⊨ ψ ⇒ E[c′] ⊨ ψ　(ψ ∈ Ψ<tspan baseline-shift="sub" font-size="18">req</tspan>)</text>

    <rect x="72" y="916" width="244" height="30" rx="15" fill="#e2f4f1"/>
    <text x="194" y="937" text-anchor="middle" font-size="18" font-weight="700" fill="#0d6f67">✓ 允许上下文内可替换</text>
    <rect x="336" y="916" width="312" height="30" rx="15" fill="#edf0f2"/>
    <text x="492" y="937" text-anchor="middle" font-size="18" font-weight="700" fill="#45515d">仍需另查：反馈良定 + 性质适用</text>
  </g>

  <!-- C: same ports, failed substitution -->
  <g>
    <rect x="30" y="970" width="660" height="452" rx="24" fill="#ffffff" stroke="#d8d5cf" stroke-width="2"/>
    <text class="panel-title" x="52" y="1008">C　同端口候选 c″ 仍然可能破坏原系统主张</text>

    <rect x="190" y="1034" width="340" height="58" rx="18" fill="#e2f4f1" stroke="#16877d" stroke-width="2"/>
    <text class="formula-large" x="360" y="1071" text-anchor="middle">✓　I(c″) = I(c)　—　可以接入</text>

    <rect x="54" y="1116" width="612" height="68" rx="18" fill="#fff1ee" stroke="#c95c4d" stroke-width="2" stroke-dasharray="8 6"/>
    <text class="card-title" x="78" y="1145" fill="#a94236">1　新增边界行为</text>
    <text class="formula" x="642" y="1158" text-anchor="end">B<tspan baseline-shift="sub" font-size="18">c″</tspan> ⊈ B<tspan baseline-shift="sub" font-size="18">c</tspan></text>
    <text class="small" x="78" y="1172">新的延迟、饱和或故障分支进入闭环历史</text>

    <rect x="54" y="1200" width="612" height="68" rx="18" fill="#fff1ee" stroke="#c95c4d" stroke-width="2" stroke-dasharray="8 6"/>
    <text class="card-title" x="78" y="1229" fill="#a94236">2　收窄环境假设</text>
    <text class="formula" x="642" y="1242" text-anchor="end">A<tspan baseline-shift="sub" font-size="18">old</tspan> ⊈ A<tspan baseline-shift="sub" font-size="18">new</tspan></text>
    <text class="small" x="78" y="1256">候选件额外要求更低时延或新的上游信号</text>

    <rect x="54" y="1284" width="612" height="68" rx="18" fill="#fff1ee" stroke="#c95c4d" stroke-width="2" stroke-dasharray="8 6"/>
    <text class="card-title" x="78" y="1313" fill="#a94236">3　反馈不良定</text>
    <text class="formula" x="642" y="1326" text-anchor="end">∄ 唯一因果解</text>
    <text class="small" x="78" y="1340">合法接线仍可以无解、多解或形成非因果环</text>

    <rect x="90" y="1372" width="540" height="36" rx="18" fill="#fff1ee" stroke="#c95c4d" stroke-width="2.5"/>
    <text x="360" y="1397" text-anchor="middle" font-size="21" font-weight="700" fill="#a94236">E[c] ⊨ ψ　⇏　E[c″] ⊨ ψ</text>
  </g>

  <text class="small" x="360" y="1462" text-anchor="middle">可替换性保存的是已声明的上下文与性质，不是一个脱离用途的“更好”分数</text>
  <text class="small" x="360" y="1487" text-anchor="middle">形式替换成立后，计算制品和部署实例的证据仍要分别做影响分析</text>
</svg>
