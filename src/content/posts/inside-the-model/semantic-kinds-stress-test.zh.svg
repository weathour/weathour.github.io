<svg xmlns="http://www.w3.org/2000/svg" width="720" height="1660" viewBox="0 0 720 1660" role="img" aria-labelledby="title desc">
  <title id="title">六种模型语义类型的压力测试</title>
  <desc id="desc">关系、解场、概率核、优化问题、因果模型和闭环 agent 共享从有类型呈现到形式语义的模式，但各自必须保留不同信息，不能都压缩为确定函数或无权行为集合。</desc>
  <style>
    text { font-family: "Noto Sans CJK SC", "PingFang SC", "Microsoft YaHei", sans-serif; fill: #17212b; }
    .title { font-size: 34px; font-weight: 700; }
    .subtitle { font-size: 19px; fill: #5f6872; }
    .card-title { font-size: 25px; font-weight: 700; }
    .formula { font-size: 22px; font-family: "STIX Two Math", "Cambria Math", serif; }
    .body { font-size: 20px; fill: #45515d; }
    .small { font-size: 18px; fill: #5f6872; }
    .tag { font-size: 18px; font-weight: 700; fill: #ffffff; }
  </style>

  <rect width="720" height="1660" rx="28" fill="#f7f5f0"/>
  <text class="title" x="44" y="62">统一的是型式，不是结果容器</text>
  <text class="subtitle" x="44" y="96">pτ ∈ Presτ(Στ)　⟼　Semτ = ⟦pτ⟧</text>

  <g transform="translate(44 132)">
    <rect width="632" height="218" rx="24" fill="#e8efff" stroke="#3b6fd8" stroke-width="2"/>
    <rect x="22" y="20" width="94" height="34" rx="17" fill="#285dbb"/>
    <text class="tag" x="69" y="43" text-anchor="middle" fill="#ffffff">关系</text>
    <text class="card-title" x="140" y="45">静态／代数模型</text>
    <text class="formula" x="28" y="92">F(x,y;θ)=0　↦　Rθ ⊆ X × Y</text>
    <text class="body" x="28" y="132">可以是无方向的约束，不必先指定 input → output。</text>
    <text class="small" x="28" y="174">不可丢失：允许的成对关系与变量类型</text>
    <text class="small" x="28" y="201">反例：把所有关系强制定向，会制造并不存在的唯一解。</text>
  </g>

  <g transform="translate(44 372)">
    <rect width="632" height="218" rx="24" fill="#e2f4f1" stroke="#16877d" stroke-width="2"/>
    <rect x="22" y="20" width="94" height="34" rx="17" fill="#0d6f67"/>
    <text class="tag" x="69" y="43" text-anchor="middle" fill="#ffffff">解与执行</text>
    <text class="card-title" x="140" y="45">PDE／混合系统</text>
    <text class="formula" x="28" y="92">Fθ[u]=0, C[u]=0　↦　允许的解场／执行</text>
    <text class="body" x="28" y="132">未适定时语义可以集合值；guard 与 invariant 保留非确定性。</text>
    <text class="small" x="28" y="174">不可丢失：定义域、边初值、解概念、跳转规则</text>
    <text class="small" x="28" y="201">反例：一次仿真轨迹不是全部可能行为。</text>
  </g>

  <g transform="translate(44 612)">
    <rect width="632" height="218" rx="24" fill="#f0e9fb" stroke="#7b4ab5" stroke-width="2"/>
    <rect x="22" y="20" width="94" height="34" rx="17" fill="#65379c"/>
    <text class="tag" x="69" y="43" text-anchor="middle" fill="#ffffff">权重</text>
    <text class="card-title" x="140" y="45">概率模型／随机过程</text>
    <text class="formula" x="28" y="92">Kθ(x,A)=Prθ(Y∈A | x)</text>
    <text class="body" x="28" y="132">同一输入给事件集合分配概率，而不是指定唯一输出。</text>
    <text class="small" x="28" y="174">不可丢失：概率权重、σ-代数、条件结构</text>
    <text class="small" x="28" y="201">反例：support 相同的两个分布仍可完全不同。</text>
  </g>

  <g transform="translate(44 852)">
    <rect width="632" height="218" rx="24" fill="#fff3e2" stroke="#c27919" stroke-width="2"/>
    <rect x="22" y="20" width="94" height="34" rx="17" fill="#8d570e"/>
    <text class="tag" x="69" y="43" text-anchor="middle" fill="#ffffff">排序</text>
    <text class="card-title" x="140" y="45">优化模型</text>
    <text class="formula" x="28" y="92">(Fθ,Jθ)　↦　(vθ, arg min Jθ)</text>
    <text class="body" x="28" y="132">解对应可以为空或多值；算法只寻找一次候选解。</text>
    <text class="small" x="28" y="174">不可丢失：可行集、目标排序、值函数</text>
    <text class="small" x="28" y="201">反例：argmin 相同，不表示两个目标函数相同。</text>
  </g>

  <g transform="translate(44 1092)">
    <rect width="632" height="218" rx="24" fill="#f7e9ec" stroke="#b65468" stroke-width="2"/>
    <rect x="22" y="20" width="94" height="34" rx="17" fill="#914052"/>
    <text class="tag" x="69" y="43" text-anchor="middle" fill="#ffffff">查询</text>
    <text class="card-title" x="140" y="45">结构因果模型</text>
    <text class="formula" x="28" y="92">M=(U,V,F,PU)　↦　P(y | do(x))</text>
    <text class="body" x="28" y="132">干预替换生成机制；普通条件化不能代替 do 语义。</text>
    <text class="small" x="28" y="174">不可丢失：机制方向、外生律、查询类型</text>
    <text class="small" x="28" y="201">反例：观察分布相同，干预答案仍可能不同。</text>
  </g>

  <g transform="translate(44 1332)">
    <rect width="632" height="218" rx="24" fill="#edf0f2" stroke="#66717b" stroke-width="2"/>
    <rect x="22" y="20" width="94" height="34" rx="17" fill="#4f5a64"/>
    <text class="tag" x="69" y="43" text-anchor="middle" fill="#ffffff">闭环</text>
    <text class="card-title" x="140" y="45">ABM／agent—环境闭环</text>
    <text class="formula" x="28" y="92">Close(Aθ,E)　↦　闭环轨迹分布</text>
    <text class="body" x="28" y="132">先分开 agent 规则与形式环境转移，再讨论复合轨迹。</text>
    <text class="small" x="28" y="174">不可丢失：上下文更新、环境转移与终止语义</text>
    <text class="small" x="28" y="201">反例：同一 LLM 权重可以组成不同 agent。</text>
  </g>

  <text class="small" x="360" y="1615" text-anchor="middle">共同的是“有类型呈现 → 形式语义”；不同的是必须保留的信息。</text>
</svg>
