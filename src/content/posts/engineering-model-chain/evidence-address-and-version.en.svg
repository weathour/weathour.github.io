<svg xmlns="http://www.w3.org/2000/svg" width="720" height="1760" viewBox="0 0 720 1760" role="img" aria-labelledby="title desc">
  <title id="title">Evidence has an address and a version</title>
  <desc id="desc">The traffic system runs through W-Z-C-O-W, while model M is a semantic dependency of C; controller documentation, interface documentation, and road-test evidence attach to different relations. TMR separates mesh and code verification from experimental validation for the same standard SA model version. After a version change, evidence transfers only through impact analysis.</desc>
  <defs>
    <marker id="arrow-dark" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 Z" fill="#34424f"/>
    </marker>
    <marker id="arrow-blue" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 Z" fill="#3567c8"/>
    </marker>
  </defs>
  <style>
    text { font-family: "Inter", "Noto Sans", "Arial", sans-serif; fill: #17212b; }
    .title { font-size: 32px; font-weight: 700; }
    .subtitle { font-size: 18px; fill: #5f6872; }
    .panel-title { font-size: 23px; font-weight: 700; }
    .label { font-size: 17px; font-weight: 700; }
    .body { font-size: 16px; fill: #45515d; }
    .node-body { font-size: 15px; fill: #45515d; }
    .q-body { font-size: 14px; fill: #45515d; }
    .small { font-size: 15px; fill: #5f6872; }
    .symbol { font-size: 20px; font-weight: 700; }
    .card { stroke-width: 2; }
    .q { fill: #e8efff; stroke: #3567c8; stroke-width: 2; stroke-dasharray: 6 5; }
  </style>

  <rect width="720" height="1760" rx="28" fill="#f7f5f0"/>
  <text class="title" x="44" y="60">Evidence Has an Address and a Version</text>
  <text class="subtitle" x="44" y="94">One result cannot qualify the entire model chain by itself</text>

  <!-- A: Traffic closed loop -->
  <g>
    <rect x="30" y="124" width="660" height="466" rx="24" fill="#ffffff" stroke="#d8d5cf" stroke-width="2"/>
    <text class="panel-title" x="52" y="164">A  Traffic system: runtime loop + semantic dependency</text>

    <rect class="card" x="48" y="202" width="178" height="108" rx="17" fill="#e8efff" stroke="#3b6fd8"/>
    <text class="symbol" x="68" y="234" fill="#285dbb">M</text>
    <text class="label" x="101" y="234">Vehicle model</text>
    <text class="node-body" x="68" y="269">States + following law</text>
    <text class="node-body" x="68" y="295">Online-ID assumptions</text>

    <rect class="card" x="271" y="202" width="178" height="108" rx="17" fill="#f0e9fb" stroke="#7b4ab5"/>
    <text class="symbol" x="291" y="234" fill="#65379c">C</text>
    <text class="label" x="324" y="234">Artifact</text>
    <text class="node-body" x="291" y="269">Identification + MPC</text>
    <text class="node-body" x="291" y="295">and mode switching</text>

    <rect class="card" x="494" y="202" width="178" height="108" rx="17" fill="#fff0d7" stroke="#c27919"/>
    <text class="symbol" x="514" y="234" fill="#a85f0b">O</text>
    <text class="label" x="547" y="234">Deployed</text>
    <text class="node-body" x="514" y="269">PC104 + CAN</text>
    <text class="node-body" x="514" y="295">Factory ACC interface</text>

    <line x1="226" y1="256" x2="263" y2="256" stroke="#34424f" stroke-width="2.5" stroke-dasharray="6 5" marker-end="url(#arrow-dark)"/>
    <line x1="449" y1="256" x2="486" y2="256" stroke="#34424f" stroke-width="2.5" marker-end="url(#arrow-dark)"/>

    <rect class="q" x="168" y="177" width="162" height="31" rx="15"/>
    <text x="249" y="199" text-anchor="middle" font-size="14" font-weight="700" fill="#285dbb">Q controller account</text>
    <rect class="q" x="391" y="177" width="162" height="31" rx="15"/>
    <text x="472" y="199" text-anchor="middle" font-size="14" font-weight="700" fill="#285dbb">Q interface account</text>

    <rect class="card" x="271" y="365" width="401" height="98" rx="18" fill="#e2f4f1" stroke="#16877d"/>
    <text class="symbol" x="293" y="399" fill="#0d6f67">W</text>
    <text class="label" x="328" y="399">Two Infiniti FX45s</text>
    <text x="293" y="431" font-size="14" fill="#45515d">LiDAR, DSRC, proving ground + public road</text>
    <text x="293" y="454" font-size="14" fill="#45515d">Actions change state; observations supply the next input</text>

    <path d="M583 310 L583 357" fill="none" stroke="#34424f" stroke-width="2.5" marker-end="url(#arrow-dark)"/>
    <path d="M289 365 C220 346 210 315 270 286" fill="none" stroke="#16877d" stroke-width="2.5" stroke-dasharray="8 6" marker-end="url(#arrow-dark)"/>
    <text class="small" x="601" y="342">act</text>
    <text class="small" x="184" y="336">observed record Z</text>
    <rect class="q" x="486" y="344" width="172" height="31" rx="15"/>
    <text x="572" y="366" text-anchor="middle" font-size="14" font-weight="700" fill="#285dbb">Q closed-loop test</text>

    <rect x="48" y="490" width="624" height="70" rx="16" fill="#fff1ee" stroke="#c95c4d" stroke-width="2"/>
    <text x="70" y="520" font-size="17" font-weight="700" fill="#a94236">Claim address:</text>
    <text x="200" y="520" font-size="15" fill="#45515d">prototype · named vehicles + conditions · reported configuration</text>
    <text x="70" y="547" font-size="14" fill="#45515d">Road tests add deployment evidence; they do not become production safety certification.</text>
  </g>

  <!-- B: TMR -->
  <g>
    <rect x="30" y="614" width="660" height="706" rx="24" fill="#ffffff" stroke="#d8d5cf" stroke-width="2"/>
    <text class="panel-title" x="52" y="654">B  TMR: one model version, two evidence questions</text>

    <rect class="card" x="190" y="686" width="340" height="84" rx="18" fill="#e8efff" stroke="#3b6fd8"/>
    <text class="symbol" x="214" y="719" fill="#285dbb">M<tspan baseline-shift="sub" font-size="14">v</tspan></text>
    <text class="label" x="258" y="719">Standard SA equations + model version</text>
    <text class="body" x="360" y="751" text-anchor="middle">Shared mathematical definition</text>

    <path d="M360 770 C360 797 190 797 190 828" fill="none" stroke="#3567c8" stroke-width="2.5" marker-end="url(#arrow-blue)"/>
    <path d="M360 770 C360 797 530 797 530 828" fill="none" stroke="#3567c8" stroke-width="2.5" marker-end="url(#arrow-blue)"/>

    <g>
      <rect x="48" y="835" width="284" height="52" rx="15" fill="#e8efff" stroke="#3567c8" stroke-width="2"/>
      <text class="label" x="190" y="868" text-anchor="middle" fill="#285dbb">Verification: code vs. equations</text>

      <rect class="card" x="48" y="912" width="284" height="116" rx="17" fill="#f0e9fb" stroke="#7b4ab5"/>
      <text class="label" x="68" y="945">3D bump case</text>
      <text class="body" x="68" y="978">CFL3D + FUN3D</text>
      <text class="body" x="68" y="1004">Five nested meshes per code</text>

      <line x1="190" y1="1028" x2="190" y2="1061" stroke="#34424f" stroke-width="2.5" marker-end="url(#arrow-dark)"/>
      <rect class="q" x="48" y="1068" width="284" height="92" rx="17"/>
      <text class="label" x="68" y="1101" fill="#285dbb">Q<tspan baseline-shift="sub" font-size="14">ver</tspan>  mesh + code trends</text>
      <text class="q-body" x="68" y="1132">Supports implementation consistency</text>
      <text class="q-body" x="68" y="1155">for the stated equations + boundaries</text>
    </g>

    <g>
      <rect x="388" y="835" width="284" height="52" rx="15" fill="#e8efff" stroke="#3567c8" stroke-width="2"/>
      <text class="label" x="530" y="868" text-anchor="middle" fill="#285dbb">Validation: model vs. experiment</text>

      <rect class="card" x="388" y="912" width="284" height="116" rx="17" fill="#f0e9fb" stroke="#7b4ab5"/>
      <text class="label" x="408" y="945">2D convex-curvature case</text>
      <text class="body" x="408" y="978">Three codes, same 513×193 mesh</text>
      <text class="body" x="408" y="1004">Predictions vs. revised experiment</text>

      <line x1="530" y1="1028" x2="530" y2="1061" stroke="#34424f" stroke-width="2.5" marker-end="url(#arrow-dark)"/>
      <rect class="q" x="388" y="1068" width="284" height="92" rx="17"/>
      <text x="408" y="1101" font-size="16" font-weight="700" fill="#285dbb">Q<tspan baseline-shift="sub" font-size="13">val</tspan>  experimental comparison</text>
      <text x="408" y="1132" font-size="14" fill="#45515d">Supports a bounded physical judgment</text>
      <text x="408" y="1155" font-size="14" fill="#45515d">for named conditions + observables</text>
    </g>

    <rect x="48" y="1190" width="624" height="91" rx="18" fill="#fff1ee" stroke="#c95c4d" stroke-width="2"/>
    <text x="360" y="1225" text-anchor="middle" font-size="20" font-weight="700" fill="#a94236">Code agreement ≠ adequate description of reality</text>
    <text class="body" x="360" y="1256" text-anchor="middle">Both paths share a model version but answer different questions</text>
    <text class="small" x="646" y="1305" text-anchor="end">Field deployment O: not applicable</text>
  </g>

  <!-- C: Lifecycle -->
  <g>
    <rect x="30" y="1344" width="660" height="354" rx="24" fill="#ffffff" stroke="#d8d5cf" stroke-width="2"/>
    <text class="panel-title" x="52" y="1384">C  Lifecycle: evidence follows unaffected dependencies</text>

    <rect x="64" y="1425" width="172" height="64" rx="18" fill="#f3f1ee" stroke="#817a72" stroke-width="2"/>
    <text x="150" y="1465" text-anchor="middle" font-size="21" font-weight="700" font-family="STIX Two Math, Times New Roman, serif">𝒢<tspan baseline-shift="sub" font-size="14">t</tspan></text>
    <rect x="274" y="1425" width="172" height="64" rx="18" fill="#fff0d7" stroke="#c27919" stroke-width="2"/>
    <text x="360" y="1454" text-anchor="middle" font-size="20" font-weight="700">Change Δ<tspan baseline-shift="sub" font-size="14">t</tspan></text>
    <text x="360" y="1478" text-anchor="middle" font-size="11" fill="#5f6872">parameters · code · I/O · use</text>
    <rect x="484" y="1425" width="172" height="64" rx="18" fill="#f3f1ee" stroke="#817a72" stroke-width="2"/>
    <text x="570" y="1465" text-anchor="middle" font-size="21" font-weight="700" font-family="STIX Two Math, Times New Roman, serif">𝒢<tspan baseline-shift="sub" font-size="14">t+1</tspan></text>
    <line x1="236" y1="1457" x2="266" y2="1457" stroke="#34424f" stroke-width="2.5" marker-end="url(#arrow-dark)"/>
    <line x1="446" y1="1457" x2="476" y2="1457" stroke="#34424f" stroke-width="2.5" marker-end="url(#arrow-dark)"/>

    <rect class="q" x="64" y="1527" width="592" height="61" rx="16"/>
    <text x="84" y="1553" font-size="17" font-weight="700" fill="#285dbb">Transfer</text>
    <text x="166" y="1553" font-size="14" fill="#45515d">Impact analysis leaves the original claim's dependencies unchanged</text>
    <text class="small" x="166" y="1578">Evidence moves with an explicit claim-validity-version binding</text>

    <rect x="64" y="1607" width="592" height="61" rx="16" fill="#fff1ee" stroke="#c95c4d" stroke-width="2" stroke-dasharray="7 6"/>
    <text x="84" y="1633" font-size="17" font-weight="700" fill="#a94236">Requalify</text>
    <text x="166" y="1633" font-size="14" fill="#45515d">Change reaches its address: algorithm, interface, domain, or use</text>
    <text class="small" x="166" y="1658">Materials may be reused; the qualification judgment is not inherited</text>
  </g>

  <text class="small" x="360" y="1732" text-anchor="middle">Case sources: Bu et al. (2010) and Turbulence Modeling Resource; independently redrawn</text>
</svg>
