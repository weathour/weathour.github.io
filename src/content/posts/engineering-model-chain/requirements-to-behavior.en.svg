<svg xmlns="http://www.w3.org/2000/svg" width="720" height="1180" viewBox="0 0 720 1180" role="img" aria-labelledby="title desc">
  <title id="title">From requirements to behavior: exact definitions and engineering proxies</title>
  <desc id="desc">The upper panel uses shortest path to show that a specification and operational criterion may coincide exactly. The lower panel uses PATH cooperative adaptive cruise control to show that finite-horizon costs and constraints operationalize only part of the requirements for headway tracking, safety, comfort, and fallback. Claims must still be assigned separately to mathematical, computational, and deployed behavior.</desc>
  <defs>
    <marker id="arrow-dark" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 Z" fill="#34424f"/>
    </marker>
    <marker id="arrow-green" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 Z" fill="#16877d"/>
    </marker>
    <marker id="arrow-amber" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 Z" fill="#c27919"/>
    </marker>
  </defs>
  <style>
    text { font-family: "Inter", "Noto Sans", "Arial", sans-serif; fill: #17212b; }
    .title { font-size: 31px; font-weight: 700; }
    .subtitle { font-size: 18px; fill: #5f6872; }
    .panel-title { font-size: 23px; font-weight: 700; }
    .symbol { font-size: 20px; font-weight: 700; }
    .label { font-size: 18px; font-weight: 700; }
    .body { font-size: 16.5px; fill: #45515d; }
    .compact-body { font-size: 15px; fill: #45515d; }
    .small { font-size: 16px; fill: #5f6872; }
    .formula { font-family: "STIX Two Math", "Times New Roman", serif; font-size: 20px; font-style: italic; }
    .card { stroke-width: 2; }
  </style>

  <rect width="720" height="1180" rx="28" fill="#f7f5f0"/>
  <text class="title" x="44" y="60">From Requirements to Behavior</text>
  <text class="subtitle" x="44" y="94">An "objective" may define a task or merely proxy its requirements</text>

  <!-- A: shortest path -->
  <g>
    <rect x="30" y="124" width="660" height="382" rx="24" fill="#ffffff" stroke="#d8d5cf" stroke-width="2"/>
    <text class="panel-title" x="52" y="164">A  Shortest path: the criterion can state the full task</text>

    <rect class="card" x="48" y="190" width="246" height="106" rx="18" fill="#f3f1ee" stroke="#817a72"/>
    <text class="symbol" x="68" y="222" fill="#625c56">S</text>
    <text class="label" x="100" y="222">Specification</text>
    <text class="compact-body" x="68" y="255">Graph, edge weights, start/end</text>
    <text class="compact-body" x="68" y="281">Find a feasible shortest path</text>

    <rect class="card" x="426" y="190" width="246" height="106" rx="18" fill="#f3f1ee" stroke="#817a72"/>
    <text class="symbol" x="446" y="222" fill="#625c56">J</text>
    <text class="label" x="478" y="222">Operational criterion</text>
    <text class="formula" x="549" y="267" text-anchor="middle">min<tspan baseline-shift="sub" font-size="15">p∈P</tspan> Σ<tspan baseline-shift="sub" font-size="15">e∈p</tspan> c<tspan baseline-shift="sub" font-size="15">e</tspan></text>

    <line x1="302" y1="245" x2="418" y2="245" stroke="#16877d" stroke-width="3" marker-end="url(#arrow-green)"/>
    <rect x="323" y="208" width="78" height="29" rx="14" fill="#e2f4f1"/>
    <text x="362" y="229" text-anchor="middle" font-size="16" font-weight="700" fill="#0d6f67">Exact match</text>

    <text class="small" x="48" y="328">The conclusion must still name the behavior it concerns</text>
    <g>
      <rect class="card" x="48" y="346" width="184" height="103" rx="16" fill="#e8efff" stroke="#3b6fd8"/>
      <text class="symbol" x="68" y="377" fill="#285dbb">B<tspan baseline-shift="sub" font-size="14">M</tspan></text>
      <text class="body" x="68" y="410">Feasible path set</text>
      <text class="body" x="68" y="436">and its cost ordering</text>

      <rect class="card" x="268" y="346" width="184" height="103" rx="16" fill="#f0e9fb" stroke="#7b4ab5"/>
      <text class="symbol" x="288" y="377" fill="#65379c">B<tspan baseline-shift="sub" font-size="14">C</tspan></text>
      <text class="body" x="288" y="410">Path returned by</text>
      <text class="body" x="288" y="436">the actual program</text>

      <rect class="card" x="488" y="346" width="184" height="103" rx="16" fill="#fff0d7" stroke="#c27919" stroke-dasharray="8 6"/>
      <text class="symbol" x="508" y="377" fill="#a85f0b">B<tspan baseline-shift="sub" font-size="14">O</tspan></text>
      <text class="body" x="508" y="410">Not applicable</text>
      <text class="body" x="508" y="436">Offline task</text>
    </g>
    <line x1="232" y1="398" x2="260" y2="398" stroke="#34424f" stroke-width="2.5" marker-end="url(#arrow-dark)"/>
    <line x1="452" y1="398" x2="480" y2="398" stroke="#34424f" stroke-width="2.5" marker-end="url(#arrow-dark)"/>
    <text class="small" x="360" y="484" text-anchor="middle">A precise task definition still requires a separate implementation check</text>
  </g>

  <!-- B: CACC -->
  <g>
    <rect x="30" y="530" width="660" height="584" rx="24" fill="#ffffff" stroke="#d8d5cf" stroke-width="2"/>
    <text class="panel-title" x="52" y="570">B  PATH CACC: requirements are partly operationalized</text>

    <rect class="card" x="48" y="596" width="246" height="134" rx="18" fill="#f3f1ee" stroke="#817a72"/>
    <text class="symbol" x="68" y="628" fill="#625c56">S</text>
    <text class="label" x="100" y="628">Requirements</text>
    <text class="compact-body" x="68" y="662">Short headway · ride comfort</text>
    <text class="compact-body" x="68" y="690">Safe gap · speed + brake limits</text>
    <text class="compact-body" x="68" y="716">Fallback on target mismatch</text>

    <rect class="card" x="426" y="596" width="246" height="134" rx="18" fill="#f3f1ee" stroke="#817a72"/>
    <text class="symbol" x="446" y="628" fill="#625c56">J</text>
    <text x="478" y="628" font-size="16" font-weight="700">Finite-horizon criterion</text>
    <text class="formula" x="549" y="669" text-anchor="middle">Σ [ρ<tspan baseline-shift="sub" font-size="14">e</tspan>e<tspan baseline-shift="sub" font-size="14">1</tspan>² + ρ<tspan baseline-shift="sub" font-size="14">u</tspan>(Δu)²</text>
    <text class="formula" x="549" y="697" text-anchor="middle">+ ρ<tspan baseline-shift="sub" font-size="14">v</tspan>(v<tspan baseline-shift="sub" font-size="14">p</tspan>−v<tspan baseline-shift="sub" font-size="14">f</tspan>)²]</text>
    <text x="549" y="721" text-anchor="middle" font-size="14" fill="#45515d">Distance, speed + accel. limits</text>

    <line x1="302" y1="663" x2="418" y2="663" stroke="#c27919" stroke-width="3" stroke-dasharray="8 6" marker-end="url(#arrow-amber)"/>
    <rect x="313" y="616" width="100" height="31" rx="15" fill="#fff0d7"/>
    <text x="363" y="638" text-anchor="middle" font-size="16" font-weight="700" fill="#a85f0b">Partial match</text>

    <text class="small" x="48" y="770">Model, computation, and interfaces give one criterion three behavioral addresses</text>
    <g>
      <rect class="card" x="48" y="792" width="184" height="134" rx="16" fill="#e8efff" stroke="#3b6fd8"/>
      <text class="symbol" x="68" y="825" fill="#285dbb">B<tspan baseline-shift="sub" font-size="14">M</tspan></text>
      <text class="body" x="68" y="858">Predicted following</text>
      <text class="body" x="68" y="885">trajectories satisfy</text>
      <text class="body" x="68" y="910">feasible constraints</text>

      <rect class="card" x="268" y="792" width="184" height="134" rx="16" fill="#f0e9fb" stroke="#7b4ab5"/>
      <text class="symbol" x="288" y="825" fill="#65379c">B<tspan baseline-shift="sub" font-size="14">C</tspan></text>
      <text class="compact-body" x="288" y="858">Online identification</text>
      <text class="compact-body" x="288" y="885">+ MPC issues a</text>
      <text class="compact-body" x="288" y="910">speed command</text>

      <rect class="card" x="488" y="792" width="184" height="134" rx="16" fill="#fff0d7" stroke="#c27919"/>
      <text class="symbol" x="508" y="825" fill="#a85f0b">B<tspan baseline-shift="sub" font-size="14">O</tspan></text>
      <text class="body" x="508" y="858">Factory ACC + car</text>
      <text class="body" x="508" y="885">Proving ground +</text>
      <text class="body" x="508" y="910">public road</text>
    </g>
    <line x1="232" y1="859" x2="260" y2="859" stroke="#34424f" stroke-width="2.5" marker-end="url(#arrow-dark)"/>
    <line x1="452" y1="859" x2="480" y2="859" stroke="#34424f" stroke-width="2.5" marker-end="url(#arrow-dark)"/>
    <text x="250" y="842" text-anchor="middle" font-size="11" fill="#5f6872">impl.</text>
    <text x="470" y="842" text-anchor="middle" font-size="11" fill="#5f6872">integr.</text>

    <rect x="48" y="954" width="624" height="104" rx="18" fill="#fff1ee" stroke="#c95c4d" stroke-width="2"/>
    <text x="70" y="986" font-size="19" font-weight="700" fill="#a94236">An optimal criterion ≠ an achieved engineering purpose</text>
    <text class="body" x="70" y="1017">If the cooperating lead vehicle cannot be identified, the system falls back</text>
    <text class="body" x="70" y="1044">to factory ACC. Such interface behavior is absent from the cost function.</text>

    <text class="small" x="360" y="1093" text-anchor="middle">Case source: Bu, Tan, and Huang (2010); independently redrawn</text>
  </g>

  <text x="360" y="1143" text-anchor="middle" font-size="13" fill="#5f6872">S: specification · J: operational criterion</text>
  <text x="360" y="1163" text-anchor="middle" font-size="13" fill="#5f6872">B<tspan baseline-shift="sub" font-size="11">M</tspan> / B<tspan baseline-shift="sub" font-size="11">C</tspan> / B<tspan baseline-shift="sub" font-size="11">O</tspan>: model / computational / deployed behavior</text>
</svg>
