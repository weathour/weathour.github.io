<svg xmlns="http://www.w3.org/2000/svg" width="720" height="1320" viewBox="0 0 720 1320" role="img" aria-labelledby="title desc">
  <title id="title">Eight roles and two paths of use in the engineering model chain</title>
  <desc id="desc">The upper panel relates purpose, specification, referent system, data, semantic model, operational criterion, and computational artifact. The lower panel separates the offline path, in which results return to a decision, from the embedded path, in which an artifact enters an operational system. Qualification appears as an evidence label and lifecycle as an external version track.</desc>
  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,4 L0,8 Z" fill="#34424f"/>
    </marker>
    <marker id="arrowBlue" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,4 L0,8 Z" fill="#3567c8"/>
    </marker>
    <marker id="arrowCoral" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,4 L0,8 Z" fill="#c95c4d"/>
    </marker>
  </defs>
  <style>
    text { font-family: "Inter", "Noto Sans", "Arial", sans-serif; fill: #17212b; }
    .title { font-size: 27px; font-weight: 700; }
    .subtitle { font-size: 17px; fill: #5f6872; }
    .panel-title { font-size: 23px; font-weight: 700; }
    .band-label { font-size: 16px; font-weight: 700; fill: #68727c; letter-spacing: .4px; }
    .node-symbol { font-size: 22px; font-weight: 800; }
    .node-label { font-size: 16px; font-weight: 700; }
    .edge-label { font-size: 15px; font-weight: 600; fill: #4e5964; }
    .small { font-size: 15px; fill: #5f6872; }
    .node { stroke-width: 2; }
    .edge { fill: none; stroke: #34424f; stroke-width: 2.5; marker-end: url(#arrow); }
    .offline { fill: none; stroke: #3567c8; stroke-width: 3; stroke-dasharray: 9 7; marker-end: url(#arrowBlue); }
    .embedded { fill: none; stroke: #34424f; stroke-width: 3.2; marker-end: url(#arrow); }
  </style>

  <rect width="720" height="1320" rx="28" fill="#f7f5f0"/>
  <text class="title" x="40" y="58">Engineering Model Chain: Objects, Relations, Use</text>
  <text class="subtitle" x="40" y="91">Arrows are typed dependencies, not fixed stages or a time sequence</text>

  <g id="panel-a">
    <rect x="28" y="122" width="664" height="720" rx="24" fill="#ffffff" stroke="#d8d5cf" stroke-width="2"/>
    <text class="panel-title" x="52" y="164">A  How a problem becomes executable computation</text>

    <rect x="48" y="190" width="624" height="150" rx="18" fill="#fff6e8"/>
    <text class="band-label" x="64" y="218">INTENT + SPECIFICATION</text>
    <rect class="node" x="74" y="242" width="188" height="70" rx="16" fill="#fff0d7" stroke="#c27919"/>
    <text class="node-symbol" x="94" y="284" fill="#a85f0b">P</text>
    <text class="node-label" x="130" y="274">Purpose +</text>
    <text class="node-label" x="130" y="295">decision</text>
    <rect class="node" x="458" y="242" width="188" height="70" rx="16" fill="#f3f1ee" stroke="#817a72"/>
    <text class="node-symbol" x="478" y="284" fill="#625d57">S</text>
    <text class="node-label" x="514" y="284">Requirements</text>

    <rect x="48" y="356" width="624" height="236" rx="18" fill="#eef6f7"/>
    <text class="band-label" x="64" y="384">REFERENT + SEMANTICS</text>
    <rect class="node" x="66" y="420" width="174" height="74" rx="16" fill="#e2f4f1" stroke="#16877d"/>
    <text class="node-symbol" x="84" y="464" fill="#0d6f67">W</text>
    <text class="node-label" x="124" y="453">Referent</text>
    <text class="node-label" x="124" y="474">system</text>
    <rect class="node" x="274" y="420" width="174" height="74" rx="16" fill="#f3f1ee" stroke="#817a72"/>
    <text class="node-symbol" x="294" y="464" fill="#625d57">Z</text>
    <text class="node-label" x="332" y="464">Observed data</text>
    <rect class="node" x="482" y="420" width="174" height="74" rx="16" fill="#e8efff" stroke="#3b6fd8"/>
    <text class="node-symbol" x="502" y="464" fill="#285dbb">M</text>
    <text class="node-label" x="540" y="453">Semantic</text>
    <text class="node-label" x="540" y="474">model</text>

    <rect x="48" y="608" width="624" height="202" rx="18" fill="#f5f0fb"/>
    <text class="band-label" x="64" y="636">IMPLEMENTATION + USE</text>
    <rect class="node" x="176" y="674" width="174" height="74" rx="16" fill="#f3f1ee" stroke="#817a72"/>
    <text class="node-symbol" x="196" y="718" fill="#625d57">J</text>
    <text class="node-label" x="234" y="707">Operational</text>
    <text class="node-label" x="234" y="728">criterion</text>
    <rect class="node" x="470" y="674" width="174" height="74" rx="16" fill="#f0e9fb" stroke="#7b4ab5"/>
    <text class="node-symbol" x="490" y="718" fill="#65379c">C</text>
    <text class="node-label" x="518" y="707">Computational</text>
    <text class="node-label" x="518" y="728">artifact</text>

    <path class="edge" d="M262 277 H446"/>
    <text class="edge-label" x="354" y="266" text-anchor="middle">derive S</text>

    <path class="edge" d="M136 312 C128 350 130 384 142 408"/>
    <text class="edge-label" x="74" y="361">set boundary</text>

    <path class="edge" d="M240 457 H262"/>
    <text class="edge-label" x="251" y="445" text-anchor="middle">obs.</text>

    <path class="edge" d="M448 457 H470"/>
    <text class="edge-label" x="459" y="445" text-anchor="middle">ID</text>

    <path class="edge" d="M153 420 C224 382 496 382 569 420"/>
    <rect x="306" y="382" width="102" height="28" rx="14" fill="#ffffff"/>
    <text class="edge-label" x="357" y="402" text-anchor="middle">abstract</text>

    <path class="edge" d="M600 312 C680 380 684 530 620 610 C544 646 400 650 292 664"/>
    <rect x="560" y="524" width="100" height="28" rx="14" fill="#ffffff"/>
    <text class="edge-label" x="610" y="544" text-anchor="middle">operationalize</text>

    <path class="edge" d="M568 494 V662"/>
    <text class="edge-label" x="581" y="585">impl.</text>

    <path class="edge" d="M350 711 H458"/>
    <text class="edge-label" x="404" y="700" text-anchor="middle">guide</text>
  </g>

  <g id="panel-b">
    <rect x="28" y="866" width="664" height="398" rx="24" fill="#ffffff" stroke="#d8d5cf" stroke-width="2"/>
    <text class="panel-title" x="52" y="908">B  Computation enters two operational settings</text>

    <rect class="node" x="270" y="938" width="180" height="70" rx="16" fill="#f0e9fb" stroke="#7b4ab5"/>
    <text class="node-symbol" x="292" y="980" fill="#65379c">C</text>
    <text class="node-label" x="322" y="968">Computational</text>
    <text class="node-label" x="322" y="989">artifact</text>

    <rect class="node" x="56" y="1082" width="188" height="70" rx="16" fill="#fff0d7" stroke="#c27919"/>
    <text class="node-symbol" x="76" y="1124" fill="#a85f0b">P</text>
    <text class="node-label" x="112" y="1114">Purpose +</text>
    <text class="node-label" x="112" y="1135">decision</text>

    <rect class="node" x="488" y="1018" width="174" height="70" rx="16" fill="#fff0d7" stroke="#c27919"/>
    <text class="node-symbol" x="508" y="1060" fill="#a85f0b">O</text>
    <text class="node-label" x="546" y="1049">Operational</text>
    <text class="node-label" x="546" y="1070">system</text>
    <rect class="node" x="488" y="1124" width="174" height="70" rx="16" fill="#e2f4f1" stroke="#16877d"/>
    <text class="node-symbol" x="508" y="1166" fill="#0d6f67">W</text>
    <text class="node-label" x="546" y="1155">Referent</text>
    <text class="node-label" x="546" y="1176">system</text>

    <path class="offline" d="M286 997 C238 1019 194 1048 166 1072"/>
    <text class="edge-label" x="228" y="1044" text-anchor="middle" fill="#3567c8">offline return</text>
    <rect x="62" y="1005" width="132" height="34" rx="17" fill="#e8efff" stroke="#3567c8" stroke-width="1.5" stroke-dasharray="5 4"/>
    <text x="128" y="1028" text-anchor="middle" font-size="15px" font-weight="700" fill="#285dbb">Q · evidence label</text>
    <path d="M194 1022 L210 1030" fill="none" stroke="#3567c8" stroke-width="1.5" stroke-dasharray="4 4"/>

    <path class="embedded" d="M450 974 C484 978 519 993 545 1008"/>
    <text class="edge-label" x="509" y="970" text-anchor="middle">integrate</text>
    <path class="embedded" d="M575 1088 V1112"/>
    <text class="edge-label" x="590" y="1110">act</text>

    <path d="M105 1082 C104 978 188 948 260 962" fill="none" stroke="#c95c4d" stroke-width="2.5" stroke-dasharray="6 6" marker-end="url(#arrowCoral)"/>
    <text x="64" y="962" font-size="15px" font-weight="700" fill="#b44b3e">revision / requalification</text>

    <line x1="66" y1="1224" x2="648" y2="1224" stroke="#7c858e" stroke-width="2" stroke-dasharray="3 8"/>
    <circle cx="106" cy="1224" r="7" fill="#7c858e"/>
    <circle cx="606" cy="1224" r="7" fill="#7c858e"/>
    <text class="small" x="74" y="1210" font-family="STIX Two Math, Times New Roman, serif">𝒢<tspan baseline-shift="sub" font-size="12px">t</tspan></text>
    <text class="small" x="574" y="1210" font-family="STIX Two Math, Times New Roman, serif">𝒢<tspan baseline-shift="sub" font-size="12px">t+1</tspan></text>
    <rect x="234" y="1200" width="254" height="48" rx="24" fill="#f3f1ee"/>
    <text x="361" y="1230" text-anchor="middle" font-size="15px" font-weight="700" fill="#5f6872">L · versions, monitoring, updates</text>
  </g>

  <text class="small" x="360" y="1298" text-anchor="middle">Q and L cross the relational map; they are not ninth and tenth nodes</text>
</svg>
