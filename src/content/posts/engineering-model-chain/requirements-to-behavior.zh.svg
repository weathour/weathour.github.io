<svg xmlns="http://www.w3.org/2000/svg" width="720" height="1180" viewBox="0 0 720 1180" role="img" aria-labelledby="title desc">
  <title id="title">从要求到行为：精确定义与工程代理</title>
  <desc id="desc">上半部分用最短路说明规范与操作判据可以精确重合；下半部分用 PATH 协同自适应巡航说明时距跟踪、安全边界、舒适与回退要求只被有限时域代价与约束部分操作化，结论还要分别落到数学行为、计算行为和部署行为。</desc>
  <defs>
    <marker id="arrow-dark" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 Z" fill="#34424f"/>
    </marker>
    <marker id="arrow-green" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 Z" fill="#16877d"/>
    </marker>
    <marker id="arrow-amber" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 Z" fill="#c27919"/>
    </marker>
  </defs>
  <style>
    text { font-family: "Noto Sans CJK SC", "PingFang SC", "Microsoft YaHei", sans-serif; fill: #17212b; }
    .title { font-size: 32px; font-weight: 700; }
    .subtitle { font-size: 18px; fill: #5f6872; }
    .panel-title { font-size: 24px; font-weight: 700; }
    .symbol { font-size: 20px; font-weight: 700; }
    .label { font-size: 21px; font-weight: 700; }
    .body { font-size: 18px; fill: #45515d; }
    .small { font-size: 18px; fill: #5f6872; }
    .formula { font-family: "STIX Two Math", "Times New Roman", serif; font-size: 20px; font-style: italic; }
    .card { stroke-width: 2; }
  </style>

  <rect width="720" height="1180" rx="28" fill="#f7f5f0"/>
  <text class="title" x="44" y="60">从要求到行为：哪里精确，哪里会偏移</text>
  <text class="subtitle" x="44" y="94">同样叫“目标”，它可能定义任务，也可能只代理工程要求</text>

  <!-- A: shortest path -->
  <g>
    <rect x="30" y="124" width="660" height="382" rx="24" fill="#ffffff" stroke="#d8d5cf" stroke-width="2"/>
    <text class="panel-title" x="52" y="164">A　最短路：任务可以被判据完整写下</text>

    <rect class="card" x="48" y="190" width="246" height="106" rx="18" fill="#f3f1ee" stroke="#817a72"/>
    <text class="symbol" x="68" y="222" fill="#625c56">S</text>
    <text class="label" x="100" y="222">规范</text>
    <text class="body" x="68" y="255">给定图、边权与起终点</text>
    <text class="body" x="68" y="281">找总权重最小的可行路径</text>

    <rect class="card" x="426" y="190" width="246" height="106" rx="18" fill="#f3f1ee" stroke="#817a72"/>
    <text class="symbol" x="446" y="222" fill="#625c56">J</text>
    <text class="label" x="478" y="222">操作判据</text>
    <text class="formula" x="549" y="267" text-anchor="middle">min<tspan baseline-shift="sub" font-size="15">p∈P</tspan> Σ<tspan baseline-shift="sub" font-size="15">e∈p</tspan> c<tspan baseline-shift="sub" font-size="15">e</tspan></text>

    <line x1="302" y1="245" x2="418" y2="245" stroke="#16877d" stroke-width="3" marker-end="url(#arrow-green)"/>
    <rect x="323" y="208" width="78" height="29" rx="14" fill="#e2f4f1"/>
    <text x="362" y="229" text-anchor="middle" font-size="17" font-weight="700" fill="#0d6f67">精确对应</text>

    <text class="small" x="48" y="328">结论仍要说明落在哪一种行为上</text>
    <g>
      <rect class="card" x="48" y="346" width="184" height="103" rx="16" fill="#e8efff" stroke="#3b6fd8"/>
      <text class="symbol" x="68" y="377" fill="#285dbb">B<tspan baseline-shift="sub" font-size="14">M</tspan></text>
      <text class="body" x="68" y="410">可行路径集合</text>
      <text class="body" x="68" y="436">及其代价次序</text>

      <rect class="card" x="268" y="346" width="184" height="103" rx="16" fill="#f0e9fb" stroke="#7b4ab5"/>
      <text class="symbol" x="288" y="377" fill="#65379c">B<tspan baseline-shift="sub" font-size="14">C</tspan></text>
      <text class="body" x="288" y="410">程序实际返回</text>
      <text class="body" x="288" y="436">哪一条路径</text>

      <rect class="card" x="488" y="346" width="184" height="103" rx="16" fill="#fff0d7" stroke="#c27919" stroke-dasharray="8 6"/>
      <text class="symbol" x="508" y="377" fill="#a85f0b">B<tspan baseline-shift="sub" font-size="14">O</tspan></text>
      <text class="body" x="508" y="410">不适用</text>
      <text class="body" x="508" y="436">这是离线任务</text>
    </g>
    <line x1="232" y1="398" x2="260" y2="398" stroke="#34424f" stroke-width="2.5" marker-end="url(#arrow-dark)"/>
    <line x1="452" y1="398" x2="480" y2="398" stroke="#34424f" stroke-width="2.5" marker-end="url(#arrow-dark)"/>
    <text class="small" x="360" y="484" text-anchor="middle">任务定义可以精确，程序实现仍需单独检查</text>
  </g>

  <!-- B: CACC -->
  <g>
    <rect x="30" y="530" width="660" height="584" rx="24" fill="#ffffff" stroke="#d8d5cf" stroke-width="2"/>
    <text class="panel-title" x="52" y="570">B　PATH CACC：工程要求只被部分操作化</text>

    <rect class="card" x="48" y="596" width="246" height="134" rx="18" fill="#f3f1ee" stroke="#817a72"/>
    <text class="symbol" x="68" y="628" fill="#625c56">S</text>
    <text class="label" x="100" y="628">规范与要求</text>
    <text class="body" x="68" y="662">较短车头时距 · 乘坐舒适</text>
    <text class="body" x="68" y="690">安全距离 · 速度与制动边界</text>
    <text class="body" x="68" y="716">目标不匹配时仍要有回退</text>

    <rect class="card" x="426" y="596" width="246" height="134" rx="18" fill="#f3f1ee" stroke="#817a72"/>
    <text class="symbol" x="446" y="628" fill="#625c56">J</text>
    <text class="label" x="478" y="628">有限时域判据</text>
    <text class="formula" x="549" y="669" text-anchor="middle">Σ [ρ<tspan baseline-shift="sub" font-size="14">e</tspan>e<tspan baseline-shift="sub" font-size="14">1</tspan>² + ρ<tspan baseline-shift="sub" font-size="14">u</tspan>(Δu)²</text>
    <text class="formula" x="549" y="697" text-anchor="middle">+ ρ<tspan baseline-shift="sub" font-size="14">v</tspan>(v<tspan baseline-shift="sub" font-size="14">p</tspan>−v<tspan baseline-shift="sub" font-size="14">f</tspan>)²]</text>
    <text class="body" x="549" y="721" text-anchor="middle">另加距离、速度、加速度约束</text>

    <line x1="302" y1="663" x2="418" y2="663" stroke="#c27919" stroke-width="3" stroke-dasharray="8 6" marker-end="url(#arrow-amber)"/>
    <rect x="313" y="616" width="100" height="31" rx="15" fill="#fff0d7"/>
    <text x="363" y="638" text-anchor="middle" font-size="17" font-weight="700" fill="#a85f0b">部分对应</text>

    <text class="small" x="48" y="770">同一判据经过模型、计算与接口，产生三个不同地址的行为</text>
    <g>
      <rect class="card" x="48" y="792" width="184" height="134" rx="16" fill="#e8efff" stroke="#3b6fd8"/>
      <text class="symbol" x="68" y="825" fill="#285dbb">B<tspan baseline-shift="sub" font-size="14">M</tspan></text>
      <text class="body" x="68" y="858">预测的跟车轨迹</text>
      <text class="body" x="68" y="885">可行解内约束满足</text>
      <text class="small" x="68" y="912">数学行为</text>

      <rect class="card" x="268" y="792" width="184" height="134" rx="16" fill="#f0e9fb" stroke="#7b4ab5"/>
      <text class="symbol" x="288" y="825" fill="#65379c">B<tspan baseline-shift="sub" font-size="14">C</tspan></text>
      <text class="body" x="288" y="858">在线辨识 + MPC</text>
      <text class="body" x="288" y="885">输出车辆速度命令</text>
      <text class="small" x="288" y="912">计算行为</text>

      <rect class="card" x="488" y="792" width="184" height="134" rx="16" fill="#fff0d7" stroke="#c27919"/>
      <text class="symbol" x="508" y="825" fill="#a85f0b">B<tspan baseline-shift="sub" font-size="14">O</tspan></text>
      <text class="body" x="508" y="858">原厂 ACC + 实车</text>
      <text class="body" x="508" y="885">试验场与公共道路</text>
      <text class="small" x="508" y="912">部署行为</text>
    </g>
    <line x1="232" y1="859" x2="260" y2="859" stroke="#34424f" stroke-width="2.5" marker-end="url(#arrow-dark)"/>
    <line x1="452" y1="859" x2="480" y2="859" stroke="#34424f" stroke-width="2.5" marker-end="url(#arrow-dark)"/>
    <text x="250" y="842" text-anchor="middle" font-size="16" fill="#5f6872">实现</text>
    <text x="470" y="842" text-anchor="middle" font-size="16" fill="#5f6872">集成</text>

    <rect x="48" y="954" width="624" height="104" rx="18" fill="#fff1ee" stroke="#c95c4d" stroke-width="2"/>
    <text x="70" y="986" font-size="19" font-weight="700" fill="#a94236">判据最优 ≠ 工程目的已经实现</text>
    <text class="body" x="70" y="1017">识别不到合作前车时，系统回退到原厂 ACC；</text>
    <text class="body" x="70" y="1044">这类接口与运行行为并不包含在代价函数里。</text>

    <text class="small" x="360" y="1093" text-anchor="middle">案例依据：Bu、Tan 与 Huang（2010）；本图为独立重绘</text>
  </g>

  <text class="small" x="360" y="1152" text-anchor="middle">S：规范　J：操作判据　B<tspan baseline-shift="sub" font-size="13">M</tspan>／B<tspan baseline-shift="sub" font-size="13">C</tspan>／B<tspan baseline-shift="sub" font-size="13">O</tspan>：数学／计算／部署行为</text>
</svg>
