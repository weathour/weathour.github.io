<svg xmlns="http://www.w3.org/2000/svg" width="720" height="1760" viewBox="0 0 720 1760" role="img" aria-labelledby="title desc">
  <title id="title">证据有地址，也有版本</title>
  <desc id="desc">交通系统的运行闭环为 W–Z–C–O–W，模型 M 作为 C 的语义依赖；控制器说明、接口说明与道路试验证据分别附着于不同关系。TMR 从同一标准 SA 模型版本分出网格和代码验证、以及与实验比较的确认路径；版本变化后，证据只有经过影响分析才能继承。</desc>
  <defs>
    <marker id="arrow-dark" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 Z" fill="#34424f"/>
    </marker>
    <marker id="arrow-blue" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 Z" fill="#3567c8"/>
    </marker>
  </defs>
  <style>
    text { font-family: "Noto Sans CJK SC", "PingFang SC", "Microsoft YaHei", sans-serif; fill: #17212b; }
    .title { font-size: 32px; font-weight: 700; }
    .subtitle { font-size: 18px; fill: #5f6872; }
    .panel-title { font-size: 24px; font-weight: 700; }
    .label { font-size: 20px; font-weight: 700; }
    .body { font-size: 18px; fill: #45515d; }
    .small { font-size: 17px; fill: #5f6872; }
    .symbol { font-size: 20px; font-weight: 700; }
    .card { stroke-width: 2; }
    .q { fill: #e8efff; stroke: #3567c8; stroke-width: 2; stroke-dasharray: 6 5; }
  </style>

  <rect width="720" height="1760" rx="28" fill="#f7f5f0"/>
  <text class="title" x="44" y="60">证据有地址，也有版本</text>
  <text class="subtitle" x="44" y="94">一份结果不会自动替整条模型链背书</text>

  <!-- A: Traffic closed loop -->
  <g>
    <rect x="30" y="124" width="660" height="466" rx="24" fill="#ffffff" stroke="#d8d5cf" stroke-width="2"/>
    <text class="panel-title" x="52" y="164">A　交通系统：运行闭环与语义依赖</text>

    <rect class="card" x="48" y="202" width="178" height="108" rx="17" fill="#e8efff" stroke="#3b6fd8"/>
    <text class="symbol" x="68" y="234" fill="#285dbb">M</text>
    <text class="label" x="101" y="234">车辆模型</text>
    <text class="body" x="68" y="269">状态、跟驰关系</text>
    <text class="body" x="68" y="295">与在线辨识假设</text>

    <rect class="card" x="271" y="202" width="178" height="108" rx="17" fill="#f0e9fb" stroke="#7b4ab5"/>
    <text class="symbol" x="291" y="234" fill="#65379c">C</text>
    <text class="label" x="324" y="234">计算制品</text>
    <text class="body" x="291" y="269">辨识、MPC</text>
    <text class="body" x="291" y="295">与模式切换</text>

    <rect class="card" x="494" y="202" width="178" height="108" rx="17" fill="#fff0d7" stroke="#c27919"/>
    <text class="symbol" x="514" y="234" fill="#a85f0b">O</text>
    <text class="label" x="547" y="234">部署实例</text>
    <text class="body" x="514" y="269">PC104、CAN</text>
    <text class="body" x="514" y="295">原厂 ACC 接口</text>

    <line x1="226" y1="256" x2="263" y2="256" stroke="#34424f" stroke-width="2.5" stroke-dasharray="6 5" marker-end="url(#arrow-dark)"/>
    <line x1="449" y1="256" x2="486" y2="256" stroke="#34424f" stroke-width="2.5" marker-end="url(#arrow-dark)"/>

    <rect class="q" x="202" y="177" width="94" height="31" rx="15"/>
    <text x="249" y="199" text-anchor="middle" font-size="16" font-weight="700" fill="#285dbb">Q 控制器说明</text>
    <rect class="q" x="425" y="177" width="94" height="31" rx="15"/>
    <text x="472" y="199" text-anchor="middle" font-size="16" font-weight="700" fill="#285dbb">Q 接口说明</text>

    <rect class="card" x="271" y="365" width="401" height="98" rx="18" fill="#e2f4f1" stroke="#16877d"/>
    <text class="symbol" x="293" y="399" fill="#0d6f67">W</text>
    <text class="label" x="328" y="399">两辆 Infiniti FX45</text>
    <text class="body" x="293" y="431">LiDAR、DSRC、试验场与公共道路工况</text>
    <text class="body" x="293" y="454">动作改变车辆状态，传感与通信返回下一轮输入</text>

    <path d="M583 310 L583 357" fill="none" stroke="#34424f" stroke-width="2.5" marker-end="url(#arrow-dark)"/>
    <path d="M289 365 C220 346 210 315 270 286" fill="none" stroke="#16877d" stroke-width="2.5" stroke-dasharray="8 6" marker-end="url(#arrow-dark)"/>
    <text class="small" x="601" y="342">动作</text>
    <text class="small" x="184" y="336">观测记录 Z</text>
    <rect class="q" x="498" y="344" width="148" height="31" rx="15"/>
    <text x="572" y="366" text-anchor="middle" font-size="16" font-weight="700" fill="#285dbb">Q 闭环试验</text>

    <rect x="48" y="490" width="624" height="70" rx="16" fill="#fff1ee" stroke="#c95c4d" stroke-width="2"/>
    <text x="70" y="520" font-size="18" font-weight="700" fill="#a94236">主张的地址：</text>
    <text class="body" x="188" y="520">原型系统 · 指定车辆与工况 · 论文所述配置</text>
    <text class="body" x="70" y="547">道路试验补充部署证据，但并不改名为生产安全认证。</text>
  </g>

  <!-- B: TMR -->
  <g>
    <rect x="30" y="614" width="660" height="706" rx="24" fill="#ffffff" stroke="#d8d5cf" stroke-width="2"/>
    <text class="panel-title" x="52" y="654">B　TMR：同一模型版本，两个证据问题</text>

    <rect class="card" x="220" y="686" width="280" height="84" rx="18" fill="#e8efff" stroke="#3b6fd8"/>
    <text class="symbol" x="244" y="719" fill="#285dbb">M<tspan baseline-shift="sub" font-size="14">v</tspan></text>
    <text class="label" x="290" y="719">标准 SA 方程与模型版本</text>
    <text class="body" x="360" y="751" text-anchor="middle">共享数学定义</text>

    <path d="M360 770 C360 797 190 797 190 828" fill="none" stroke="#3567c8" stroke-width="2.5" marker-end="url(#arrow-blue)"/>
    <path d="M360 770 C360 797 530 797 530 828" fill="none" stroke="#3567c8" stroke-width="2.5" marker-end="url(#arrow-blue)"/>

    <g>
      <rect x="48" y="835" width="284" height="52" rx="15" fill="#e8efff" stroke="#3567c8" stroke-width="2"/>
      <text class="label" x="190" y="868" text-anchor="middle" fill="#285dbb">验证：实现了方程吗？</text>

      <rect class="card" x="48" y="912" width="284" height="116" rx="17" fill="#f0e9fb" stroke="#7b4ab5"/>
      <text class="label" x="68" y="945">三维凸起算例</text>
      <text class="body" x="68" y="978">CFL3D 与 FUN3D</text>
      <text class="body" x="68" y="1004">每个代码 5 级嵌套网格</text>

      <line x1="190" y1="1028" x2="190" y2="1061" stroke="#34424f" stroke-width="2.5" marker-end="url(#arrow-dark)"/>
      <rect class="q" x="48" y="1068" width="284" height="92" rx="17"/>
      <text class="label" x="68" y="1101" fill="#285dbb">Q<tspan baseline-shift="sub" font-size="14">ver</tspan>　网格与代码趋势</text>
      <text class="body" x="68" y="1132">支持指定方程与边界下的</text>
      <text class="body" x="68" y="1155">实现一致性</text>
    </g>

    <g>
      <rect x="388" y="835" width="284" height="52" rx="15" fill="#e8efff" stroke="#3567c8" stroke-width="2"/>
      <text class="label" x="530" y="868" text-anchor="middle" fill="#285dbb">确认：描述得够好吗？</text>

      <rect class="card" x="388" y="912" width="284" height="116" rx="17" fill="#f0e9fb" stroke="#7b4ab5"/>
      <text class="label" x="408" y="945">二维凸曲率算例</text>
      <text class="body" x="408" y="978">3 个代码，同一 513×193 网格</text>
      <text class="body" x="408" y="1004">计算量与修订后的实验数据比较</text>

      <line x1="530" y1="1028" x2="530" y2="1061" stroke="#34424f" stroke-width="2.5" marker-end="url(#arrow-dark)"/>
      <rect class="q" x="388" y="1068" width="284" height="92" rx="17"/>
      <text class="label" x="408" y="1101" fill="#285dbb">Q<tspan baseline-shift="sub" font-size="14">val</tspan>　实验比较</text>
      <text class="body" x="408" y="1132">支持特定工况与观测量上的</text>
      <text class="body" x="408" y="1155">有限物理判断</text>
    </g>

    <rect x="48" y="1190" width="624" height="91" rx="18" fill="#fff1ee" stroke="#c95c4d" stroke-width="2"/>
    <text x="360" y="1225" text-anchor="middle" font-size="21" font-weight="700" fill="#a94236">代码彼此一致 ≠ 模型对现实已经充分</text>
    <text class="body" x="360" y="1256" text-anchor="middle">两条路径共享模型版本，却回答不同问题</text>
    <text class="small" x="646" y="1305" text-anchor="end">现场部署 O：不适用</text>
  </g>

  <!-- C: Lifecycle -->
  <g>
    <rect x="30" y="1344" width="660" height="354" rx="24" fill="#ffffff" stroke="#d8d5cf" stroke-width="2"/>
    <text class="panel-title" x="52" y="1384">C　生命周期：证据能否沿用，要看变化碰到了什么</text>

    <rect x="64" y="1425" width="172" height="64" rx="18" fill="#f3f1ee" stroke="#817a72" stroke-width="2"/>
    <text x="150" y="1465" text-anchor="middle" font-size="21" font-weight="700" font-family="STIX Two Math, Times New Roman, serif">𝒢<tspan baseline-shift="sub" font-size="14">t</tspan></text>
    <rect x="274" y="1425" width="172" height="64" rx="18" fill="#fff0d7" stroke="#c27919" stroke-width="2"/>
    <text x="360" y="1454" text-anchor="middle" font-size="20" font-weight="700">Δ<tspan baseline-shift="sub" font-size="14">t</tspan> 变化</text>
    <text class="small" x="360" y="1478" text-anchor="middle">参数 · 代码 · 接口 · 用途</text>
    <rect x="484" y="1425" width="172" height="64" rx="18" fill="#f3f1ee" stroke="#817a72" stroke-width="2"/>
    <text x="570" y="1465" text-anchor="middle" font-size="21" font-weight="700" font-family="STIX Two Math, Times New Roman, serif">𝒢<tspan baseline-shift="sub" font-size="14">t+1</tspan></text>
    <line x1="236" y1="1457" x2="266" y2="1457" stroke="#34424f" stroke-width="2.5" marker-end="url(#arrow-dark)"/>
    <line x1="446" y1="1457" x2="476" y2="1457" stroke="#34424f" stroke-width="2.5" marker-end="url(#arrow-dark)"/>

    <rect class="q" x="64" y="1527" width="592" height="61" rx="16"/>
    <text x="84" y="1553" font-size="18" font-weight="700" fill="#285dbb">可沿用</text>
    <text class="body" x="166" y="1553">影响分析表明：原主张依赖的对象与关系未改变</text>
    <text class="small" x="166" y="1578">证据随明确的“主张—有效域—版本”绑定一起迁移</text>

    <rect x="64" y="1607" width="592" height="61" rx="16" fill="#fff1ee" stroke="#c95c4d" stroke-width="2" stroke-dasharray="7 6"/>
    <text x="84" y="1633" font-size="18" font-weight="700" fill="#a94236">需复验</text>
    <text class="body" x="166" y="1633">变化触及证据地址：算法、接口、运行域或用途</text>
    <text class="small" x="166" y="1658">材料可以复用，资格化结论不会自动继承</text>
  </g>

  <text class="small" x="360" y="1732" text-anchor="middle">案例依据：Bu 等（2010）与 Turbulence Modeling Resource；本图为独立重绘</text>
</svg>
