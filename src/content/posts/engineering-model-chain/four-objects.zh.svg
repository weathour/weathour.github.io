<svg xmlns="http://www.w3.org/2000/svg" width="720" height="920" viewBox="0 0 720 920" role="img" aria-labelledby="title desc">
  <title id="title">一个工程问题涉及的四类对象</title>
  <desc id="desc">同一交通问题同时关联参照系统、语义模型、计算制品和使用情境。使用情境包括离线判断与嵌入运行。这些是角色，不是固定阶段。</desc>
  <style>
    text { font-family: "Noto Sans CJK SC", "PingFang SC", "Microsoft YaHei", sans-serif; fill: #17212b; }
    .title { font-size: 34px; font-weight: 700; letter-spacing: .5px; }
    .subtitle { font-size: 19px; fill: #5f6872; }
    .symbol { font-size: 22px; font-weight: 700; }
    .label { font-size: 28px; font-weight: 700; }
    .body { font-size: 21px; fill: #45515d; }
    .small { font-size: 18px; fill: #5f6872; }
    .center-text { fill: #ffffff; }
    .card { stroke-width: 2; }
  </style>

  <rect width="720" height="920" rx="28" fill="#f7f5f0"/>
  <text class="title" x="44" y="62">一个工程问题涉及的四类对象</text>
  <text class="subtitle" x="44" y="96">它们可以同时存在；连线表示指涉，不表示固定阶段</text>

  <g fill="none" stroke="#a9b0b7" stroke-width="2" stroke-dasharray="7 8">
    <path d="M360 435 C290 400 230 350 190 304"/>
    <path d="M360 435 C430 400 490 350 530 304"/>
    <path d="M360 475 C285 520 225 565 190 612"/>
    <path d="M360 475 C435 520 495 565 530 612"/>
  </g>

  <g>
    <rect class="card" x="38" y="132" width="304" height="220" rx="24" fill="#e2f4f1" stroke="#16877d"/>
    <text class="symbol" x="68" y="175" fill="#0d6f67">W</text>
    <text class="label" x="105" y="176">参照系统</text>
    <text class="body" x="68" y="218">道路 · 车辆 · 驾驶者</text>
    <g transform="translate(67 250)">
      <path d="M0 48 H242" stroke="#16877d" stroke-width="3"/>
      <path d="M0 74 H242" stroke="#16877d" stroke-width="3"/>
      <path d="M20 61 H222" stroke="#16877d" stroke-width="2" stroke-dasharray="12 12"/>
      <g fill="#16877d">
        <rect x="30" y="30" width="54" height="25" rx="7"/>
        <rect x="102" y="30" width="54" height="25" rx="7"/>
        <rect x="174" y="30" width="54" height="25" rx="7"/>
      </g>
    </g>
  </g>

  <g>
    <rect class="card" x="378" y="132" width="304" height="220" rx="24" fill="#e8efff" stroke="#3b6fd8"/>
    <text class="symbol" x="408" y="175" fill="#285dbb">M</text>
    <text class="label" x="449" y="176">语义模型</text>
    <text class="body" x="408" y="218">状态 · 行为 · 关系</text>
    <rect x="408" y="249" width="244" height="72" rx="14" fill="#ffffff" opacity=".72"/>
    <text x="430" y="282" font-size="22px" font-style="italic">ẋ = f(x, u)</text>
    <text x="430" y="311" font-size="18px" fill="#5f6872">允许哪些行为，符号指向什么</text>
  </g>

  <g>
    <rect class="card" x="38" y="558" width="304" height="232" rx="24" fill="#f0e9fb" stroke="#7b4ab5"/>
    <text class="symbol" x="68" y="601" fill="#65379c">C</text>
    <text class="label" x="105" y="602">计算制品</text>
    <text class="body" x="68" y="644">求解器 · 代码 · 配置</text>
    <g transform="translate(68 674)">
      <rect width="244" height="78" rx="14" fill="#ffffff" opacity=".72"/>
      <path d="M30 23 L15 39 L30 55 M214 23 L229 39 L214 55" fill="none" stroke="#7b4ab5" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
      <rect x="57" y="22" width="44" height="34" rx="6" fill="#7b4ab5" opacity=".26"/>
      <rect x="111" y="22" width="44" height="34" rx="6" fill="#7b4ab5" opacity=".45"/>
      <rect x="165" y="22" width="30" height="34" rx="6" fill="#7b4ab5" opacity=".68"/>
    </g>
  </g>

  <g>
    <rect class="card" x="378" y="558" width="304" height="292" rx="24" fill="#fff0d7" stroke="#c27919" stroke-dasharray="9 7"/>
    <text class="label" x="408" y="602">使用情境</text>
    <text class="small" x="408" y="634">叙事总称，不是第九个节点</text>

    <rect x="408" y="660" width="244" height="70" rx="16" fill="#fffaf0" stroke="#d49a4a" stroke-width="1.5"/>
    <text class="symbol" x="430" y="691" fill="#a85f0b">P</text>
    <text class="body" x="470" y="692">目的与决策</text>
    <text class="small" x="470" y="718">接收离线结果与证据</text>

    <rect x="408" y="748" width="244" height="70" rx="16" fill="#fffaf0" stroke="#d49a4a" stroke-width="1.5"/>
    <text class="symbol" x="430" y="779" fill="#a85f0b">O</text>
    <text class="body" x="470" y="780">嵌入运行</text>
    <text class="small" x="470" y="806">制品与接口进入现场</text>
  </g>

  <g>
    <rect x="238" y="402" width="244" height="106" rx="53" fill="#17212b"/>
    <text class="center-text" x="360" y="445" text-anchor="middle" font-size="19px">同一交通问题</text>
    <text class="center-text" x="360" y="478" text-anchor="middle" font-size="25px" font-weight="700">车队间距与控制</text>
  </g>

  <text class="small" x="360" y="886" text-anchor="middle">角色可以共享实体，也可以在工程中被反复改写</text>
</svg>
