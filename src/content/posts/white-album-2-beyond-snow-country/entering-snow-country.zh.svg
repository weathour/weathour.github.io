<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1600" viewBox="0 0 1200 1600" role="img" aria-labelledby="title desc">
  <title id="title">谁把他们带进“雪国”</title>
  <desc id="desc">把和纱与春希已经做出的动作，同希望暴雪封路的愿望分开；次日首班车计划与实际返京表明，雪没有替他们决定。</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0 0 10 5 0 10Z" fill="#89999d"/>
    </marker>
    <style>
      .t{font-family:"Noto Sans CJK SC","Source Han Sans SC",sans-serif;fill:#172832}
      .title{font-size:50px;font-weight:700;letter-spacing:2px}
      .sub{font-size:27px;fill:#59686e}
      .lane{font-size:29px;font-weight:700;letter-spacing:1px}
      .num{font-size:27px;font-weight:700;fill:#f4f0e8}
      .head{font-size:31px;font-weight:700}
      .body{font-size:27px;fill:#405158}
      .wish{font-size:27px;fill:#5b513f}
      .result{font-size:43px;font-weight:700;fill:#f4f0e8}
      .result-sub{font-size:26px;fill:#d7e0e1}
      .foot{font-size:24px;fill:#69767b}
      .inverse{fill:#f4f0e8}
      .line{stroke:#89999d;stroke-width:4;fill:none;marker-end:url(#arrow)}
      .wish-line{stroke:#a5844f;stroke-width:4;fill:none;stroke-dasharray:10 8;marker-end:url(#arrow)}
    </style>
  </defs>
  <rect width="1200" height="1600" fill="#f4f0e8"/>
  <rect width="1200" height="18" fill="#183440"/>
  <text x="600" y="78" text-anchor="middle" class="t title">谁把他们带进“雪国”</text>
  <text x="600" y="122" text-anchor="middle" class="t sub">把已经发生的动作，与希望天气代办的事分开</text>

  <rect x="55" y="165" width="520" height="76" rx="20" fill="#183440"/>
  <text x="315" y="214" text-anchor="middle" class="t lane inverse">已经发生</text>
  <rect x="625" y="165" width="520" height="76" rx="20" fill="#eee4d2" stroke="#a5844f" stroke-width="2"/>
  <text x="885" y="214" text-anchor="middle" class="t lane">只停在愿望</text>

  <g aria-label="已经发生的动作">
    <rect x="55" y="275" width="520" height="134" rx="20" fill="#e5eae8" stroke="#89999d" stroke-width="2"/>
    <circle cx="105" cy="342" r="29" fill="#183440"/>
    <text x="105" y="352" text-anchor="middle" class="t num">1</text>
    <text x="150" y="334" class="t head">和纱提出</text>
    <text x="150" y="374" class="t body">雪地目的地</text>

    <path d="M315 409V449" class="line"/>
    <rect x="55" y="449" width="520" height="134" rx="20" fill="#fbfaf6" stroke="#89999d" stroke-width="2"/>
    <circle cx="105" cy="516" r="29" fill="#183440"/>
    <text x="105" y="526" text-anchor="middle" class="t num">2</text>
    <text x="150" y="508" class="t head">春希同意</text>
    <text x="150" y="548" class="t body">二人出发</text>

    <path d="M315 583V623" class="line"/>
    <rect x="55" y="623" width="520" height="178" rx="20" fill="#e5eae8" stroke="#89999d" stroke-width="2"/>
    <circle cx="105" cy="712" r="29" fill="#183440"/>
    <text x="105" y="722" text-anchor="middle" class="t num">3</text>
    <text x="150" y="680" class="t head">春希叫醒和纱</text>
    <text x="150" y="723" class="t body">点名《雪国》</text>
    <text x="150" y="762" class="t body">倒数“三、二、一”</text>

    <path d="M315 801V841" class="line"/>
    <rect x="55" y="841" width="520" height="178" rx="20" fill="#fbfaf6" stroke="#89999d" stroke-width="2"/>
    <circle cx="105" cy="930" r="29" fill="#183440"/>
    <text x="105" y="940" text-anchor="middle" class="t num">4</text>
    <text x="150" y="899" class="t head">旧旅馆</text>
    <text x="150" y="942" class="t body">雪菜五年前</text>
    <text x="150" y="981" class="t body">已经预订</text>
  </g>

  <g aria-label="希望天气代办的事">
    <rect x="625" y="275" width="520" height="188" rx="20" fill="#eee4d2" stroke="#a5844f" stroke-width="2"/>
    <text x="670" y="326" class="t head">愿望</text>
    <text x="670" y="374" class="t wish">愿暴雪不断</text>
    <text x="670" y="415" class="t wish">愿道路封住，谁也回不去</text>

    <path d="M885 463V521" class="wish-line"/>
    <rect x="625" y="521" width="520" height="166" rx="20" fill="#fbfaf6" stroke="#a5844f" stroke-width="2"/>
    <text x="670" y="572" class="t head">次日安排</text>
    <text x="670" y="621" class="t wish">仍计划乘首班车</text>
    <text x="670" y="660" class="t wish">离开雪地</text>

    <path d="M885 687V745" class="wish-line"/>
    <rect x="625" y="745" width="520" height="166" rx="20" fill="#e5eae8" stroke="#89999d" stroke-width="2"/>
    <text x="670" y="796" class="t head">实际结果</text>
    <text x="670" y="845" class="t body">二人返回东京</text>
    <text x="670" y="884" class="t body">日程重新接回去</text>
  </g>

  <text x="315" y="1090" text-anchor="middle" class="t foot">目的地、出发、叫醒、倒数、旅馆</text>
  <text x="315" y="1126" text-anchor="middle" class="t foot">都由人发起，或沿用旧安排</text>
  <text x="885" y="1090" text-anchor="middle" class="t foot">断路只停在愿望里</text>
  <text x="885" y="1126" text-anchor="middle" class="t foot">首班车与返京仍要由人落实</text>

  <rect x="55" y="1190" width="1090" height="270" rx="26" fill="#183440"/>
  <text x="600" y="1284" text-anchor="middle" class="t result">雪没有替他们决定</text>
  <text x="600" y="1345" text-anchor="middle" class="t result-sub">它给已经做出的动作添上风景，</text>
  <text x="600" y="1385" text-anchor="middle" class="t result-sub">却没有发起出走，也没有替人关闭归路。</text>

  <text x="600" y="1530" text-anchor="middle" class="t foot">本文原创分析图。实线表示行动次序，虚线表示愿望、计划与结果的落差。</text>
</svg>
